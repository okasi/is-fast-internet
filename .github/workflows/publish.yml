name: Publish npm

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare automatic patch release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm version patch --no-git-tag-version

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with OIDC support
        run: npm install --global npm@latest

      - name: Show publishing tool versions
        run: |
          node --version
          npm --version

      - name: Check whether version is already published
        id: publish_status
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "is-fast-internet@$PKG_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "### is-fast-internet@$PKG_VERSION is already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.publish_status.outputs.should_publish == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.publish_status.outputs.should_publish == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.publish_status.outputs.should_publish == 'true'
        run: npm test

      - name: Verify package contents
        if: steps.publish_status.outputs.should_publish == 'true'
        run: npm pack --dry-run

      - name: Commit and tag automatic release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publish_status.outputs.should_publish == 'true'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release is-fast-internet $PKG_VERSION [skip release]"
          git tag -a "v$PKG_VERSION" -m "is-fast-internet v$PKG_VERSION"
          git push origin HEAD:main "v$PKG_VERSION"

      - name: Publish to npm
        if: steps.publish_status.outputs.should_publish == 'true'
        run: npm publish --access public --registry=https://registry.npmjs.org
